project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "knowledge/**/*.qmd"
    - "blog/**/*.qmd"
    - "!knowledge/**/template.qmd"

execute:
  freeze: auto
  cache: true

website:
  title: "Jiahong Sun"
  description: "Bioinformatics, omics, algorithms, statistics, and scientific computing"
  site-url: https://sunjh22.github.io
  favicon: profile.png
  search:
    location: navbar
    type: overlay
  reader-mode: true
  back-to-top-navigation: true
  page-navigation: true
  bread-crumbs: true
  navbar:
    background: primary
    left:
      - text: Home
        href: index.qmd
      - text: Knowledge
        href: knowledge/index.qmd
      - text: Blog
        href: blog/index.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/sunjh22
        aria-label: GitHub
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - section: "Knowledge Map"
        href: knowledge/index.qmd
        contents:
          - section: "Bioinformatics"
            href: knowledge/bioinformatics/index.qmd
            contents:
              - knowledge/bioinformatics/software.qmd
              - knowledge/bioinformatics/algorithms.qmd
              - knowledge/bioinformatics/workflows.qmd
              - knowledge/bioinformatics/databases.qmd
          - section: "Biology"
            href: knowledge/biology/index.qmd
            contents:
              - knowledge/biology/technique.qmd
          - section: "Omics Data Analysis"
            href: knowledge/omics/index.qmd
            contents:
              - knowledge/omics/genomics.qmd
              - knowledge/omics/transcriptomics.qmd
              - knowledge/omics/epigenomics.qmd
              - knowledge/omics/multiomics.qmd
              - knowledge/omics/spatial-proteomics-metabolomics.qmd
          - section: "Machine Learning"
            href: knowledge/machine-learning/index.qmd
            contents:
              - knowledge/machine-learning/basics.qmd
              - knowledge/machine-learning/deep-learning.qmd
          - section: "Statistics"
            href: knowledge/statistics/index.qmd
            contents:
              - section: "Probability & Randomness"
                href: knowledge/statistics/probability-randomness/index.qmd
                contents:
                  - knowledge/statistics/probability-randomness/probability-spaces-events-and-axioms.qmd
                  - knowledge/statistics/probability-randomness/counting-rules-and-combinatorial-probability.qmd
                  - knowledge/statistics/probability-randomness/random-variables-and-probability-distributions.qmd
                  - knowledge/statistics/probability-randomness/expectation-variance-and-moments.qmd
                  - knowledge/statistics/probability-randomness/joint-marginal-and-conditional-distributions.qmd
                  - knowledge/statistics/probability-randomness/independence-and-conditional-independence.qmd
                  - knowledge/statistics/probability-randomness/conditional-probability-and-total-probability.qmd
                  - knowledge/statistics/probability-randomness/bayes-theorem-and-bayesian-updating.qmd
                  - knowledge/statistics/probability-randomness/covariance-and-correlation.qmd
                  - knowledge/statistics/probability-randomness/transformations-of-random-variables.qmd
                  - knowledge/statistics/probability-randomness/bernoulli-and-binomial-distributions.qmd
                  - knowledge/statistics/probability-randomness/categorical-and-multinomial-distributions.qmd
                  - knowledge/statistics/probability-randomness/poisson-distribution-and-poisson-processes.qmd
                  - knowledge/statistics/probability-randomness/exponential-and-geometric-distributions.qmd
                  - knowledge/statistics/probability-randomness/distributions.qmd
              - section: "Asymptotic Thinking"
                href: knowledge/statistics/asymptotic-thinking/index.qmd
              - section: "Statistical Inference"
                href: knowledge/statistics/statistical-inference/index.qmd
              - section: "Regression & Statistical Models"
                href: knowledge/statistics/regression-models/index.qmd
                contents:
                  - knowledge/statistics/regression-models/statistical-modelling.qmd
              - section: "Advanced Modeling"
                href: knowledge/statistics/advanced-modeling/index.qmd
                contents:
                  - knowledge/statistics/advanced-modeling/mixture-models.qmd
              - section: "Real Bioinformatics Problems"
                href: knowledge/statistics/bioinformatics-problems/index.qmd
          - section: "Linux"
            href: knowledge/linux/index.qmd
            contents:
              - knowledge/linux/basic-commands.qmd
              - knowledge/linux/system-management.qmd
              - knowledge/linux/environments-networking.qmd
          - section: "Python & R"
            href: knowledge/programming/index.qmd
            contents:
              - knowledge/programming/python-basics.qmd
              - knowledge/programming/python-advanced.qmd
              - knowledge/programming/r-basics.qmd
              - knowledge/programming/r-visualization.qmd
      - section: "Blog"
        href: blog/index.qmd
        contents:
          - blog/booknotes/index.qmd
          - blog/english/index.qmd
          - blog/others/index.qmd
  page-footer:
    left: "© 2026 Jiahong Sun"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme:
      light: [litera, custom.scss]
      dark: [darkly, custom.scss]
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    code-copy: true
    anchor-sections: true
    smooth-scroll: true

knitr:
  opts_chunk:
    message: false
    warning: false
    fig-align: center
    fig-width: 8
    fig-height: 6
    dpi: 300
    dev: svg
